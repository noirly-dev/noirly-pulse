<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noirly Pulse mark">
  <title>Noirly Pulse — monochrome</title>
  <!-- Default tint for standalone use. Delete this rule to inherit color from the parent. -->
  <style>svg { color: #C9A44A; }</style>
  <!-- Broken rings. Weight decays outward now that opacity can't. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" pathLength="100">
    <circle cx="512" cy="512" r="158" stroke-width="46"
            stroke-dasharray="83 17" transform="rotate(-118 512 512)"/>
    <circle cx="512" cy="512" r="234" stroke-width="30"
            stroke-dasharray="79 21" transform="rotate(-74 512 512)"/>
    <circle cx="512" cy="512" r="306" stroke-width="18"
            stroke-dasharray="75 25" transform="rotate(-30 512 512)"/>
  </g>
  <!-- Presence core -->
  <circle cx="512" cy="512" r="76" fill="currentColor"/>
</svg>
